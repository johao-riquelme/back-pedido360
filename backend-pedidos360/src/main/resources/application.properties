spring.application.name=backend-pedidos360
server.port=8080

pedidos360.public-url=http://ec2-32-201-49-96.compute-1.amazonaws.com:8080

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/fd7c1051-f107-4307-a49d-b7901ba3e873/v2.0

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- CONFIGURACIÓN RABBITMQ ---
spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:localhost:5672,localhost:5673}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=/

spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.concurrency=3
spring.rabbitmq.listener.simple.max-concurrency=5

spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000ms
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=10000ms

spring.rabbitmq.listener.simple.default-requeue-rejected=false

spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true


# ==================================================
# CONFIGURACION APACHE KAFKA - PEDIDOS360
# ==================================================

# Conexion con Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# PRODUCTOR
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# CONSUMIDOR
spring.kafka.consumer.group-id=pedidos360-kafka-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# Paquetes autorizados para deserializar eventos
spring.kafka.consumer.properties.spring.json.trusted.packages=com.pedidos360.backend_pedidos360.model

# LISTENERS
spring.kafka.listener.auto-startup=true
spring.kafka.listener.ack-mode=record

# Concurrencia reducida para EC2 t3.micro
spring.kafka.listener.concurrency=1

# REGISTRO DE ACTIVIDAD
logging.level.org.springframework.kafka=INFO
logging.level.org.apache.kafka.clients.consumer=INFO
